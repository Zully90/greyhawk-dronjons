:root {

  --border: rgba(255,255,255,0.09);

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {

  background: var(--bg0);

.card {

}
input[type="number"] {
  background: var(--bg3);
  border: 0.5px solid var(--border2);

  height: 36px;
  width: 100%;
  outline: none;
}
input[type="number"]:focus { border-color: rgba(255,255,255,0.35); }
button {
  background: var(--bg3);
  border: 0.5px solid var(--border2);
  border-radius: 7px;
  color: var(--t1);
  font-family: 'Crimson Pro', serif;
  font-size: 14px;
  cursor: pointer;
  transition: background .12s;
}
button:hover { background: #353330; }
button:active { transform: scale(0.97); }
button:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
