<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calar del Sole — Spawn Spiriti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Crimson+Pro:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/tabler-icons.min.css">
<style>
:root {
  --bg0: #0e0d0b;
  --bg1: #181714;
  --bg2: #211f1c;
  --bg3: #2a2825;
  --border: rgba(255,255,255,0.09);
  --border2: rgba(255,255,255,0.18);
  --t1: #f0ede6;
  --t2: #a8a49c;
  --t3: #6a6762;
  --info-bg: #0a1f36;
  --info-fg: #7ab8f0;
  --warn-bg: #2d1a05;
  --warn-fg: #f5c06a;
  --warn-border: #8a5a10;
  --danger-bg: #2a0f0f;
  --danger-fg: #f09595;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Crimson Pro', Georgia, serif;
  background: var(--bg0);
  color: var(--t1);
  min-height: 100vh;
  padding: 2rem 1rem 4rem;
  font-size: 16px;
  line-height: 1.6;
}

.wrap { max-width: 660px; margin: 0 auto; }

.card {
  background: var(--bg1);
  border: 0.5px solid var(--border);
  border-radius: 11px;
  overflow: hidden;
  margin-bottom: 10px;
}

.card-body { padding: 16px 18px; }

input[type="number"] {
  background: var(--bg3);
  border: 0.5px solid var(--border2);
  border-radius: 7px;
  color: var(--t1);
  font-family: 'Crimson Pro', serif;
  font-size: 15px;
  padding: 6px 10px;
  height: 36px;
  width: 100%;
  outline: none;
  text-align: center;
}
input[type="number"]:focus { border-color: rgba(255,255,255,0.35); }

button {
  background: var(--bg3);
  border: 0.5px solid var(--border2);
  border-radius: 7px;
  color: var(--t1);
  font-family: 'Crimson Pro', serif;
  font-size: 14px;
  cursor: pointer;
  transition: background .12s;
  padding: 8px 16px;
}
button:hover { background: #353330; }
button:active { transform: scale(0.97); }
button:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

.btn-main {
  width: 100%;
  padding: 14px 20px;
  font-family: 'Cinzel', serif;
  font-size: 16px;
  letter-spacing: .07em;
  border-radius: 9px;
  background: #1a1714;
  border: 0.5px solid var(--border2);
  color: var(--t1);
  cursor: pointer;
  transition: background .15s, border-color .15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.btn-main:hover { background: #252220; border-color: rgba(255,255,255,0.28); }
.btn-main:active { transform: scale(0.98); }
.btn-main:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

/* Step cards */
.step-card {
  border-radius: 9px;
  overflow: hidden;
  margin-bottom: 10px;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity .4s ease, transform .4s ease;
  pointer-events: none;
}
.step-card.visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.step-header {
  padding: 10px 14px 9px;
  display: flex;
  align-items: center;
  gap: 9px;
  border-bottom: 0.5px solid var(--border);
}
.step-num {
  font-family: 'Cinzel', serif;
  font-size: 10px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--t3);
  flex-shrink: 0;
}
.step-title {
  font-family: 'Cinzel', serif;
  font-size: 13px;
  font-weight: 400;
  letter-spacing: .05em;
  color: var(--t2);
}
.step-body { padding: 14px 16px; }

/* Dice reveal */
.dice-row {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 12px;
}
.die-box {
  background: var(--bg3);
  border: 0.5px solid var(--border2);
  border-radius: 8px;
  width: 52px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  position: relative;
}
.die-label {
  font-size: 9px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--t3);
  position: absolute;
  bottom: 4px;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
}
.die-value {
  font-family: 'Cinzel', serif;
  font-size: 24px;
  font-weight: 500;
  line-height: 1;
  padding-bottom: 10px;
}
.die-rolling { animation: rolling .6s ease-out; }
@keyframes rolling {
  0%   { opacity: 0; transform: scale(1.6) rotate(-8deg); }
  60%  { opacity: 1; transform: scale(1.05) rotate(2deg); }
  100% { opacity: 1; transform: scale(1) rotate(0); }
}

.dice-vs {
  font-size: 12px;
  color: var(--t3);
  flex: 1;
  line-height: 1.45;
}
.dice-vs .threshold { color: var(--t2); font-size: 14px; }

/* Outcome badges */
.outcome {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 11px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
}
.outcome-safe   { background: #0f2a0f; color: #6fcf6f; border: 0.5px solid #2a5a2a; }
.outcome-danger { background: var(--danger-bg); color: var(--danger-fg); border: 0.5px solid #5a2020; }
.outcome-warn   { background: var(--warn-bg); color: var(--warn-fg); border: 0.5px solid var(--warn-border); }

/* Grade colors */
.grade-eco      { color: var(--info-fg); }
.grade-banale   { color: var(--t2); }
.grade-minore   { color: var(--warn-fg); }
.grade-grave    { color: #f0a040; }
.grade-letale   { color: var(--danger-fg); }
.grade-catastrofico { color: #ff6060; }

/* Hazard chip */
.hazard-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: #2a1208;
  border: 0.5px solid #8a4010;
  border-radius: 5px;
  padding: 2px 8px;
  font-size: 11px;
  color: #f08040;
  letter-spacing: .06em;
  text-transform: uppercase;
  vertical-align: middle;
  margin-left: 6px;
}

/* Final result */
.result-final {
  border-radius: 9px;
  padding: 18px 20px;
  background: var(--bg1);
  border: 0.5px solid var(--border);
  margin-bottom: 10px;
}
.result-name {
  font-family: 'Cinzel', serif;
  font-size: 20px;
  font-weight: 400;
  letter-spacing: .05em;
  margin-bottom: 4px;
}
.result-grade {
  font-size: 13px;
  letter-spacing: .08em;
  text-transform: uppercase;
  margin-bottom: 14px;
}
.result-desc {
  color: var(--t2);
  font-size: 15px;
  line-height: 1.55;
  margin-bottom: 10px;
}
.result-hint {
  color: var(--t3);
  font-size: 13px;
  font-style: italic;
  line-height: 1.5;
  border-top: 0.5px solid var(--border);
  padding-top: 10px;
  margin-top: 6px;
}

/* Hazard result block */
.hazard-block {
  background: #1a0e06;
  border: 0.5px solid #6a3010;
  border-radius: 7px;
  padding: 12px 14px;
  margin-top: 12px;
}
.hazard-block-title {
  font-size: 10px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: #f08040;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.hazard-block-name {
  font-family: 'Cinzel', serif;
  font-size: 15px;
  font-weight: 400;
  margin-bottom: 4px;
  color: var(--t1);
}
.hazard-block-desc {
  font-size: 14px;
  color: var(--t2);
  line-height: 1.5;
}

/* Tranquillo result */
.tranquillo {
  text-align: center;
  padding: 28px 20px;
  color: var(--t3);
}
.tranquillo .icon { font-size: 28px; margin-bottom: 8px; display: block; }
.tranquillo .msg { font-size: 15px; font-style: italic; }

/* Input grid */
.input-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}
.input-group label {
  display: block;
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--t3);
  margin-bottom: 5px;
}

/* Faro badge */
.faro-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-radius: 7px;
  background: var(--bg3);
  border: 0.5px solid var(--border);
  font-size: 13px;
  color: var(--t2);
  margin-bottom: 14px;
}
.faro-dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* Animations */
@keyframes fadeSlide {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.anim-in { animation: fadeSlide .35s ease forwards; }

/* Spinner */
@keyframes spin { to { transform: rotate(360deg); } }
.spinning { display: inline-block; animation: spin .7s linear infinite; }
</style>
</head>
<body>
<div class="wrap">

  <div style="margin-bottom:2rem;">
    <a href="index.html" style="font-size:12px;color:var(--t3);text-decoration:none;display:inline-flex;align-items:center;gap:5px;">
      <i class="ti ti-arrow-left" style="font-size:13px;" aria-hidden="true"></i> Artiglio
    </a>
  </div>

  <div style="text-align:center;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:.5px solid var(--border);">
    <div style="font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--t3);margin-bottom:6px;">Campagna Greyhawk · PF2e</div>
    <h1 style="font-family:'Cinzel',serif;font-size:22px;font-weight:400;letter-spacing:.06em;color:var(--t1);line-height:1.3;">Calar del Sole</h1>
    <div style="font-size:13px;color:var(--t3);margin-top:5px;font-style:italic;">I Sospiri disturbano il piano spirituale</div>
  </div>

  <!-- Config -->
  <div class="card" style="margin-bottom:16px;">
    <div class="card-body">
      <div class="input-grid">
        <div class="input-group">
          <label>Sospiri</label>
          <input type="number" id="inp-sospiri" min="0" max="20" value="0" placeholder="0">
        </div>
        <div class="input-group">
          <label>Mod. DES</label>
          <input type="number" id="inp-des" min="-5" max="10" value="3" placeholder="3">
        </div>
        <div class="input-group">
          <label>Livello PG</label>
          <input type="number" id="inp-lv" min="1" max="20" value="5" placeholder="5">
        </div>
      </div>

      <div id="faro-badge" class="faro-badge">
        <div id="faro-dot" class="faro-dot"></div>
        <span id="faro-text"></span>
      </div>

      <div id="overflow-warn" style="display:none;padding:8px 12px;border-radius:7px;background:var(--warn-bg);border:0.5px solid var(--warn-border);color:var(--warn-fg);font-size:13px;margin-bottom:12px;">
        <i class="ti ti-alert-triangle" style="vertical-align:middle;margin-right:5px;" aria-hidden="true"></i>
        <strong>Overflow:</strong> Sospiri &gt; Mod. DES — soglia 4+, automatico su 1–3
      </div>

      <button class="btn-main" id="btn-roll">
        <i class="ti ti-moon-stars" aria-hidden="true"></i>
        Calar del Sole — Tira il Velo
      </button>
    </div>
  </div>

  <!-- Results area -->
  <div id="results-area"></div>

  <!-- Ritira / reset -->
  <div id="btn-ritira-wrap" style="display:none;margin-top:4px;">
    <button id="btn-ritira" style="width:100%;padding:10px;font-size:13px;letter-spacing:.05em;border-radius:8px;">
      <i class="ti ti-refresh" style="vertical-align:middle;margin-right:6px;" aria-hidden="true"></i>
      Ritira
    </button>
  </div>

</div>

<script>
// ── Data tables ────────────────────────────────────────────────────────────

const MANIFESTAZIONI = [
  null, // 0 (1-indexed)
  { d20: 1,  nome: "Eco visivo",           desc: "Sogni disturbanti, ombre fuggevoli — nessun combattimento. Il Velo trema ma non cede.", hint: "Descrivi presagi e rumori. Nessun incontro, solo atmosfera.", hazard: false },
  { d20: 2,  nome: "Eco visivo",           desc: "Sogni disturbanti, ombre fuggevoli — nessun combattimento. Il Velo trema ma non cede.", hint: "Descrivi presagi e rumori. Nessun incontro, solo atmosfera.", hazard: false },
  { d20: 3,  nome: "Wisp solitario",       desc: "Un frammento confuso di coscienza si materializza, si guarda attorno e si dissolve se ignorato.", hint: "Se i PG non interagiscono, sparisce. Se attaccato, combatte brevemente poi svanisce.", hazard: false },
  { d20: 4,  nome: "Wisp solitario",       desc: "Un frammento confuso di coscienza si materializza, si guarda attorno e si dissolve se ignorato.", hint: "Se i PG non interagiscono, sparisce. Se attaccato, combatte brevemente poi svanisce.", hazard: false },
  { d20: 5,  nome: "Ombra ×1",             desc: "Una singola ombra strappata dal suo portatore emerge dall'oscurità, affamata di forza vitale.", hint: "Incontro standard. Un'ombra solitaria, gestibile.", hazard: false },
  { d20: 6,  nome: "Ombra ×1",             desc: "Una singola ombra strappata dal suo portatore emerge dall'oscurità, affamata di forza vitale.", hint: "Incontro standard. Un'ombra solitaria, gestibile.", hazard: false },
  { d20: 7,  nome: "Ombre ×2",             desc: "Due ombre emergono in sincronia — a quanto pare legate in vita, indissolubili anche nella morte.", hint: "Più pressione. Considera la loro sinergia tattica.", hazard: false },
  { d20: 8,  nome: "Ombre ×2",             desc: "Due ombre emergono in sincronia — a quanto pare legate in vita, indissolubili anche nella morte.", hint: "Più pressione. Considera la loro sinergia tattica.", hazard: false },
  { d20: 9,  nome: "Poltergeist",          desc: "Nessuna forma visibile — solo oggetti scagliati nell'aria con furia cieca. Non ha corpo da bersagliare.", hint: "HAZARD puro: usa la tabella hazard. Non è un'entità bersagliabile con attacchi normali.", hazard: true, hazardForzato: true },
  { d20: 10, nome: "Spettro",              desc: "Ricorda il momento della propria morte nei minimi dettagli. Non vuole combattere — vuole testimoni.", hint: "Può essere non ostile. Se i PG ascoltano, potrebbe rivelare informazioni sulla zona.", hazard: false },
  { d20: 11, nome: "Spettro",              desc: "Uno spettro emerge portando con sé un'aura di morte — la magia curativa si congela nell'aria.", hint: "Spettro + Hazard 3 (Zona di Morte) automatico. Tre round senza recupero PF.", hazard: true, hazardFisso: 3 },
  { d20: 12, nome: "Apparizione ancorata", desc: "Un'entità legata a questo luogo specifico — potrebbe non essere ostile, dipende da cosa le hanno fatto.", hint: "Valuta se è ostile in base al luogo. Forse vuole qualcosa dei PG.", hazard: false },
  { d20: 13, nome: "Allip",               desc: "Irradia follia come un'aura — non attacca fisicamente, ma la sua presenza corrode la mente.", hint: "Non attacca fisicamente. La follia è il pericolo. CD Volontà ogni round in zona.", hazard: false },
  { d20: 14, nome: "Ombre ×3 + Poltergeist", desc: "Un'orda di ombre sfreccia nell'oscurità mentre oggetti prendono vita tutto attorno. Caos puro.", hint: "Tre ombre simultanee + Hazard Poltergeist (2). Combattimento + pericolo ambientale.", hazard: true, hazardFisso: 2 },
  { d20: 15, nome: "Apparizione del Marchio", desc: "Riconosce il Marchio di Rui Jin — ignorando completamente gli altri, punta diritto a lui.", hint: "Questa entità attacca Rui Jin direttamente, ignorando il resto del gruppo. Priorità assoluta.", hazard: false },
  { d20: 16, nome: "Banshee",              desc: "Il grido lacera l'aria come lama — chi lo sente porta il lamento dentro di sé per ore.", hint: "Incontro serio. La banshee può uccidere con il grido. Attenzione alle immunità sonore.", hazard: false },
  { d20: 17, nome: "Wraith",              desc: "Ha un obiettivo preciso: assorbire l'Artiglio e i Sospiri che contiene. Vuole ciò che Dronjons ha.", hint: "Va directo all'Artiglio. Priorità su Dronjons. Potrebbe ignorare chi non lo difende.", hazard: false },
  { d20: 18, nome: "Spettro guerriero",   desc: "Un combattente in vita, ora guerriero della morte — porta con sé il tentativo di una possessione.", hint: "Spettro + Hazard 5 (Possessione) automatico. Doppia minaccia: combattimento e possessione.", hazard: true, hazardFisso: 5 },
  { d20: 19, nome: "Il Gregge si rivolta", desc: "Qualcosa si muove dentro l'Artiglio — un Sospiro prigioniero spinge per uscire, disperato.", hint: "CD 18 Volontà per Dronjons. Fallimento: Grabbed + perde 1 Sospiro. Nessuna creatura esterna.", hazard: false },
  { d20: 20, nome: "Il Collezionista Precedente", desc: "Un altro cacciatore di spiriti, morto con l'Artiglio in pugno. Parla. Contratta. Combatte solo se attaccato.", hint: "Trattativa prima della violenza. Sa cose sull'Artiglio. Potrebbe diventare alleato o nemico.", hazard: false },
];

const HAZARDS = [
  null, // 0
  { d6: 1, nome: "Freddo spettrale",       desc: "−2 a tutte le prove fisiche per 1 ora" },
  { d6: 2, nome: "Oggetti in volo",        desc: "1d4 oggetti/round su bersagli casuali (1d6 danni contundenti)" },
  { d6: 3, nome: "Zona di Morte",          desc: "Nessun recupero PF né magie curative per 3 round" },
  { d6: 4, nome: "Sussurri Amplificati",   desc: "Tutti Spaventati 1 — TS Volontà CD 16 per resistere" },
  { d6: 5, nome: "Possessione tentata",    desc: "Bersaglio casuale nel gruppo, TS Volontà CD 18" },
  { d6: 6, nome: "Artiglio in cortocircuito", desc: "Dronjons usa Mietere il Tormento sul primo alleato che subisce danni quel round" },
];

const GRADI = [
  { max: 3,  id: "eco",          label: "Eco",          cls: "grade-eco",          desc: "Atmosfera e presagi — nessun combattimento" },
  { max: 6,  id: "banale",       label: "Banale",       cls: "grade-banale",       desc: "Fastidioso ma non pericoloso" },
  { max: 9,  id: "minore",       label: "Minore",       cls: "grade-minore",       desc: "Vero incontro, gestibile" },
  { max: 12, id: "grave",        label: "Grave",        cls: "grade-grave",        desc: "Richiede strategia" },
  { max: 15, id: "letale",       label: "Letale",       cls: "grade-letale",       desc: "Qualcuno può morire" },
  { max: 999,id: "catastrofico", label: "Catastrofico", cls: "grade-catastrofico", desc: "Tiro su tabella speciale" },
];

// ── Helpers ─────────────────────────────────────────────────────────────────

function rand(n) { return Math.floor(Math.random() * n) + 1; }

function getSoglia(sospiri, overflow) {
  if (sospiri === 0) return null;
  if (overflow)     return { min: 4, autoBelow: 3 };
  if (sospiri === 1) return { min: 20 };
  if (sospiri === 2) return { min: 17 };
  if (sospiri === 3) return { min: 14 };
  if (sospiri === 4) return { min: 10 };
  return { min: 6 };
}

function getGrado(totale) {
  return GRADI.find(g => totale <= g.max);
}

function faroInfo(sospiri) {
  if (sospiri === 0) return { label: "Faro Silente", color: "#6a6762", hint: "Nessun rischio planare" };
  if (sospiri <= 2)  return { label: "Faro Tiepido", color: "#7ab8f0", hint: "Entità planari sentono direzione vaga entro 1 miglio" };
  if (sospiri <= 4)  return { label: "Faro Pulsante", color: "#f5c06a", hint: "+2 prove localizzazione; Marut/Cavalieri di Kas allertati entro 10 miglia" };
  return               { label: "Faro Ardente", color: "#f09595", hint: "Locate attivo 1 miglio; Servitori di Vecna conoscono direzione esatta" };
}

// ── LocalStorage sync ────────────────────────────────────────────────────────

function loadFromStorage() {
  try {
    const s = localStorage.getItem('artiglio');
    if (!s) return;
    const d = JSON.parse(s);
    if (d.sospiri !== undefined) document.getElementById('inp-sospiri').value = d.sospiri;
    if (d.des     !== undefined) document.getElementById('inp-des').value     = d.des;
    if (d.livello !== undefined) document.getElementById('inp-lv').value      = d.livello;
  } catch(e) {}
}

// ── UI updates ───────────────────────────────────────────────────────────────

function updateFaro() {
  const sospiri = parseInt(document.getElementById('inp-sospiri').value) || 0;
  const des     = parseInt(document.getElementById('inp-des').value)     || 0;
  const isOverflow = sospiri > des && sospiri > 0;

  const info = faroInfo(sospiri);
  const dot  = document.getElementById('faro-dot');
  const text = document.getElementById('faro-text');
  dot.style.background = info.color;
  dot.style.boxShadow  = sospiri > 0 ? `0 0 6px ${info.color}88` : 'none';
  text.innerHTML = `<strong style="color:${info.color}">${info.label}</strong> — <span style="color:var(--t3);font-size:12px;">${info.hint}</span>`;

  document.getElementById('overflow-warn').style.display = isOverflow ? 'block' : 'none';
}

// ── Roll engine ──────────────────────────────────────────────────────────────

let rolling = false;

async function eseguiRoll() {
  if (rolling) return;
  rolling = true;
  document.getElementById('btn-roll').disabled = true;
  document.getElementById('btn-ritira-wrap').style.display = 'none';

  const sospiri = parseInt(document.getElementById('inp-sospiri').value) || 0;
  const des     = parseInt(document.getElementById('inp-des').value)     || 0;

  const area = document.getElementById('results-area');
  area.innerHTML = '';

  // ── Step 1: Il Velo si assottiglia? ─────────────────────────────────────

  if (sospiri === 0) {
    area.innerHTML = tranquilloHTML("Faro Silente", "Nessun Sospiro, nessun rischio. Il Velo resta intatto. Il gruppo dorme tranquillo.");
    finish();
    return;
  }

  const isOverflow = sospiri > des;
  const soglia = getSoglia(sospiri, isOverflow);

  const d20_1 = rand(20);
  const disturbo = isOverflow && d20_1 <= 3 ? true : d20_1 >= soglia.min;

  await showStep(area, 1, "Il Velo si assottiglia?", buildStep1HTML(d20_1, soglia, disturbo, isOverflow), 0);

  if (!disturbo) {
    await delay(500);
    appendToArea(area, tranquilloHTML("Notte tranquilla", "Il tiro non basta a perturbare il Velo. La notte trascorre in silenzio."));
    finish();
    return;
  }

  // ── Step 2: Intensità ───────────────────────────────────────────────────

  await delay(700);
  const d10 = rand(10);
  const totaleIntensita = d10 + sospiri;
  const grado = getGrado(totaleIntensita);

  await showStep(area, 2, "Intensità", buildStep2HTML(d10, sospiri, totaleIntensita, grado), 0);

  // ── Step 3: Manifestazione ──────────────────────────────────────────────

  await delay(800);
  const d20_3 = rand(20);
  const manifEntry = MANIFESTAZIONI[d20_3];

  let hazardEntry = null;
  let hazardRoll  = null;

  if (manifEntry.hazard) {
    if (manifEntry.hazardFisso !== undefined) {
      hazardEntry = HAZARDS[manifEntry.hazardFisso];
      hazardRoll  = manifEntry.hazardFisso;
    } else {
      hazardRoll  = rand(6);
      hazardEntry = HAZARDS[hazardRoll];
    }
  }

  await showStep(area, 3, "Manifestazione", buildStep3HTML(d20_3, manifEntry, hazardRoll, hazardEntry), 0);

  // ── Risultato finale ────────────────────────────────────────────────────

  await delay(500);
  appendToArea(area, buildFinalHTML(manifEntry, grado, hazardEntry, hazardRoll));

  finish();
}

function finish() {
  document.getElementById('btn-roll').disabled = false;
  document.getElementById('btn-ritira-wrap').style.display = 'block';
  rolling = false;
}

// ── HTML builders ────────────────────────────────────────────────────────────

function buildStep1HTML(d20, soglia, disturbo, isOverflow) {
  const sogliaTxt = isOverflow
    ? `soglia <strong>${soglia.min}+</strong> (overflow — automatico su 1–3)`
    : `soglia <strong>${soglia.min}+</strong>`;

  const outcome = disturbo
    ? `<span class="outcome outcome-danger"><i class="ti ti-flame" aria-hidden="true"></i> Il Velo si assottiglia</span>`
    : `<span class="outcome outcome-safe"><i class="ti ti-moon" aria-hidden="true"></i> Notte tranquilla</span>`;

  return `
    <div class="dice-row">
      <div class="die-box">
        <span class="die-value die-rolling">${d20}</span>
        <span class="die-label">d20</span>
      </div>
      <div class="dice-vs">
        <div class="threshold">${sogliaTxt}</div>
        ${isOverflow ? '<div style="font-size:11px;color:var(--warn-fg);margin-top:2px;">⚠ Overflow attivo</div>' : ''}
      </div>
    </div>
    ${outcome}`;
}

function buildStep2HTML(d10, sospiri, totale, grado) {
  return `
    <div class="dice-row">
      <div class="die-box">
        <span class="die-value die-rolling">${d10}</span>
        <span class="die-label">d10</span>
      </div>
      <div class="dice-vs">
        <div class="threshold">${d10} + ${sospiri} Sospiri = <strong>${totale}</strong></div>
        <div style="font-size:12px;color:var(--t3);">scala 1–3 Eco · 4–6 Banale · 7–9 Minore · 10–12 Grave · 13–15 Letale · 16+ Catastrofico</div>
      </div>
    </div>
    <div style="margin-top:4px;">
      <span class="outcome outcome-warn">
        <strong class="${grado.cls}">${grado.label}</strong>
        <span style="color:var(--t3);font-size:12px;">— ${grado.desc}</span>
      </span>
    </div>`;
}

function buildStep3HTML(d20, manif, hazardRoll, hazardEntry) {
  const hazardChip = manif.hazard
    ? `<span class="hazard-chip"><i class="ti ti-skull" style="font-size:10px;" aria-hidden="true"></i> HAZARD</span>`
    : '';

  let hazardReveal = '';
  if (hazardEntry) {
    const hazardLabel = manif.hazardFisso !== undefined ? `fisso` : `d6 = ${hazardRoll}`;
    hazardReveal = `
      <div style="margin-top:10px;padding:10px 12px;background:#1a0e06;border:0.5px solid #6a3010;border-radius:7px;font-size:13px;">
        <div style="color:#f08040;font-size:10px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:4px;">
          <i class="ti ti-dice" style="font-size:11px;" aria-hidden="true"></i> Hazard (${hazardLabel})
        </div>
        <strong style="color:var(--t1);">${hazardEntry.nome}</strong>
        <span style="color:var(--t3);margin-left:6px;">— ${hazardEntry.desc}</span>
      </div>`;
  }

  return `
    <div class="dice-row">
      <div class="die-box">
        <span class="die-value die-rolling">${d20}</span>
        <span class="die-label">d20</span>
      </div>
      <div class="dice-vs">
        <div class="threshold">${manif.nome}${hazardChip}</div>
        <div style="font-size:12px;color:var(--t3);margin-top:2px;">${manif.desc.substring(0, 70)}…</div>
      </div>
    </div>
    ${hazardReveal}`;
}

function buildFinalHTML(manif, grado, hazardEntry, hazardRoll) {
  const hazardBlock = hazardEntry ? `
    <div class="hazard-block">
      <div class="hazard-block-title">
        <i class="ti ti-skull" aria-hidden="true"></i>
        HAZARD attivo
        ${manif.hazardFisso === undefined ? `<span style="font-size:10px;color:var(--t3);">(d6 = ${hazardRoll})</span>` : ''}
      </div>
      <div class="hazard-block-name">${hazardEntry.nome}</div>
      <div class="hazard-block-desc">${hazardEntry.desc}</div>
    </div>` : '';

  return `
    <div class="result-final anim-in">
      <div style="font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--t3);margin-bottom:10px;">Manifestazione</div>
      <div class="result-name">${manif.nome}</div>
      <div class="result-grade"><span class="${grado.cls}">${grado.label}</span></div>
      <div class="result-desc">${manif.desc}</div>
      ${hazardBlock}
      <div class="result-hint">
        <i class="ti ti-wand" style="font-size:12px;vertical-align:middle;margin-right:5px;" aria-hidden="true"></i>
        <strong style="color:var(--t2);font-style:normal;">DM:</strong> ${manif.hint}
      </div>
    </div>`;
}

function tranquilloHTML(titolo, msg) {
  return `
    <div class="tranquillo anim-in">
      <i class="ti ti-moon icon" aria-hidden="true"></i>
      <div style="font-family:'Cinzel',serif;font-size:16px;margin-bottom:6px;color:var(--t2);">${titolo}</div>
      <div class="msg">${msg}</div>
    </div>`;
}

// ── Step reveal helpers ──────────────────────────────────────────────────────

function showStep(area, num, titolo, innerHTML, extraDelay) {
  return new Promise(resolve => {
    setTimeout(() => {
      const card = document.createElement('div');
      card.className = 'card step-card';
      card.innerHTML = `
        <div class="step-header">
          <span class="step-num">Passo ${num}</span>
          <span class="step-title">${titolo}</span>
        </div>
        <div class="step-body">${innerHTML}</div>`;
      area.appendChild(card);
      requestAnimationFrame(() => {
        requestAnimationFrame(() => { card.classList.add('visible'); });
      });
      setTimeout(resolve, 450);
    }, extraDelay);
  });
}

function appendToArea(area, html) {
  const wrapper = document.createElement('div');
  wrapper.innerHTML = html;
  Array.from(wrapper.children).forEach(el => area.appendChild(el));
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── Init ─────────────────────────────────────────────────────────────────────

loadFromStorage();
updateFaro();

document.getElementById('inp-sospiri').addEventListener('input', updateFaro);
document.getElementById('inp-des').addEventListener('input', updateFaro);

document.getElementById('btn-roll').addEventListener('click', eseguiRoll);
document.getElementById('btn-ritira').addEventListener('click', () => {
  document.getElementById('results-area').innerHTML = '';
  document.getElementById('btn-ritira-wrap').style.display = 'none';
});
</script>
</body>
</html>
